<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILD Case Scenarios MCQs Full QA — interactive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2337536E'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' fill='%23FFD21F' text-anchor='middle'%3EILD%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   ILD Case Scenarios MCQs — interactive study file
   Pure white background · blue-gradient choices · yellow hover rim
   No ambient animation: every motion is triggered by a user action.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* the one and only choice colour (shared with buttons & highlights) */
  --choice-grad:linear-gradient(180deg,#37536E 0%,#294056 100%);
  --choice-dark:linear-gradient(180deg,#2C4459 0%,#1E3145 100%); /* default = darker */
  --blue-solid:#294056;
  --hl-grad:linear-gradient(180deg,#37536E 0%,#294056 100%);
  --yellow:#FFD21F;
  --grey:#9AA3AF;
  --grey-dark:#6E7887;
  --green:#16A34A;
  --green-dark:#0E7A36;
  --red:#C2261F;
  --red-dark:#93190F;
  --ink:#15181D;
  --line:#E6EAF1;
  --t1:#6A4BB8;   /* Case Scenario 1 theme */
  --t2:#0E7490;   /* Case Scenario 2 theme */
}
html,body{margin:0;padding:0}
body{
  background:#ffffff;                     /* PURE WHITE background only */
  color:var(--ink);
  font-family:"Segoe UI",Tahoma,"Trebuchet MS",Verdana,system-ui,-apple-system,sans-serif;
  font-size:16.5px;line-height:1.55;overflow-x:hidden;
}
::selection{background:#FFE680;color:#111}
img,svg{max-width:100%}

/* ======================== page shell ======================== */
#page{max-width:1010px;margin:0 auto;padding:26px 92px 120px 96px}

/* ======================== case scenario card ======================== */
.case{
  margin:26px 0 14px;padding:14px 18px 15px;border-radius:16px;background:#fff;
  border:2px solid var(--cl);border-left-width:9px;
  box-shadow:0 3px 0 rgba(0,0,0,.05);
}
.case h2{margin:0 0 8px;font-size:19px;letter-spacing:.2px;color:var(--cl)}
.case ul{margin:0;padding-left:20px}
.case li{margin:3px 0;font-size:16px}
.case li::marker{color:var(--cl)}

/* ============ AI notes shown after the answer (layout of the example file) ============ */
.ainote{
  margin-top:10px;padding:10px 13px;border-radius:12px;background:#f4f7fb;
  border:1.5px solid #d5e0ea;color:#1f2d3a;font-weight:600;font-size:14.2px;line-height:1.65
}
.ainote.show{animation:pop .16s ease-out 1}
.ainote > b{color:#294056;margin-right:4px}
.ainote .apts{margin:7px 0 1px;padding:0;list-style:none}
.ainote .apts li{position:relative;padding-left:17px;margin:5px 0;font-weight:600;line-height:1.6}
.ainote .apts li:before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(180deg,#37536E,#294056);box-shadow:0 0 0 2px var(--yellow),0 0 0 4.5px rgba(255,210,31,.22)}
.ainote .w1{cursor:pointer;border-radius:5px;padding:0 1px}
.ainote .w1:hover{box-shadow:0 0 0 2px var(--yellow),0 0 0 5px rgba(255,210,31,.26)}
.ainote .w1.kwb{background:var(--hl-grad);color:#fff;font-weight:800;padding:0 3px}
.ainote .w1.mk{background:var(--hl-grad)!important;color:#fff!important;font-weight:800}
.ainote .wnotes{margin:9px 0 2px;padding:8px 11px;border-radius:10px;background:#fff;border:1.5px dashed #c9d6e4}
.ainote .wsub{font-size:11.2px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;color:#0E7490;margin-bottom:3px}
.ainote .wul.tips{margin:0;padding:0;list-style:none}
.ainote .wmnem{margin-top:9px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ainote .wmnem b{flex:0 0 auto;background:var(--choice-grad);color:#fff;border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:900}
.ainote .wmnem b:hover{box-shadow:0 0 0 3px var(--yellow)}
.ainote .mntxt{font-weight:800;color:#15181D;background:#fff5cc;border-radius:6px;padding:1px 5px;border:1.5px solid #f0d97a}
.ainote .mntxt:hover{box-shadow:0 0 0 3px var(--yellow)}
.ainote .wfile{margin-top:8px;font-size:13.4px;font-weight:800;color:#3A4250}
.ainote .wfile:before{content:"\1F4C4";margin-right:5px}
.ainote .flblock{margin-top:8px;border-top:1.5px dashed #d5e0ea;padding-top:7px}
.ainote .flblock > b{display:block;font-size:11.2px;letter-spacing:.4px;text-transform:uppercase;color:#6E7887;margin-bottom:5px}
.ainote .flhint{font-size:11px;font-weight:700;color:#6E7887;margin:-2px 0 5px}
.ainote .flist2{display:flex;flex-direction:column;gap:4px}
.ainote .fli2{display:flex;gap:7px;align-items:flex-start;font-size:12.6px;color:#3A4250}
.ainote .flp{flex:0 0 auto;background:#E9EDF3;color:#294056;border-radius:6px;padding:1px 7px;font-weight:900;font-size:11.4px}
.ainote .fltxt2{font-weight:600}
.ainote .fli2:hover{box-shadow:0 0 0 3px var(--yellow);border-radius:5px}

/* ======================== question card ======================== */
.q{
  background:#fff;border:2px solid var(--cl);border-radius:18px;
  padding:14px 18px 16px;margin:16px 0;
  box-shadow:0 2px 0 rgba(0,0,0,.05);
  scroll-margin-top:70px;position:relative;
}
.q.hit{box-shadow:0 0 0 4px var(--yellow),0 2px 0 rgba(0,0,0,.05)}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.qnum{
  display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;
  border-radius:9px;background:var(--cl);color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 2px 0 rgba(0,0,0,.12)
}
.qtag{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;
  color:#fff;background:var(--choice-grad);border:1.5px solid rgba(255,255,255,.2);
  border-radius:999px;padding:4px 11px
}
.qtag:hover{box-shadow:0 0 0 3px var(--yellow),0 0 0 7px rgba(255,210,31,.26)}
.qtag i{width:9px;height:9px;border-radius:50%;background:var(--cl);display:inline-block;flex:0 0 auto}
.qtext{margin:2px 0 11px;font-size:18px;font-weight:650;line-height:1.62}
.qtext .w1{cursor:pointer;border-radius:5px;padding:0 1px}
.qtext .w1:hover{box-shadow:0 0 0 3px var(--yellow)}
.w1.mk{
  background:var(--hl-grad)!important;color:#fff!important;border-radius:5px;padding:0 3px;
  box-shadow:0 0 0 1px rgba(255,255,255,.35) inset
}
.w1.mk:hover{box-shadow:0 0 0 3px var(--yellow)}

/* ======================== choices ======================== */
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;display:flex;align-items:center;gap:10px;
  background:var(--choice-dark);color:#fff;border:1.5px solid rgba(255,255,255,.16);
  border-radius:13px;padding:10px 12px 10px 11px;cursor:pointer;
  transition:filter .13s ease,box-shadow .13s ease,background .16s ease,opacity .2s ease;
  filter:brightness(.94)
}
.opt:hover{filter:brightness(1.3);box-shadow:0 0 0 3px var(--yellow),0 0 0 7px rgba(255,210,31,.28)}
.opt .ltr{
  flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.17);border:1.5px solid rgba(255,255,255,.45);font-weight:800;font-size:14px
}
.opt .txt{flex:1 1 auto;font-size:15.6px;line-height:1.4}
.opt .xbtn{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0
}
.opt .xbtn:hover{box-shadow:0 0 0 3px var(--yellow)}
/* excluded choice */
.opt.ex{background:#0A0B0D;border-color:#0A0B0D;filter:none;text-decoration:line-through;text-decoration-thickness:2px;opacity:.92}
.opt.ex .txt{opacity:.85}
.opt.ex .xbtn{background:#FFD21F;color:#0A0B0D;border-color:#FFD21F;text-decoration:none;font-size:14px}
.opt.ex .xbtn:hover{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--yellow)}
.opt.ex .ltr{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.3)}
/* answered states (locked forever) */
.opt.locked{cursor:default}
.opt.locked:hover{filter:brightness(1.02)}
.opt.pick-ok{background:linear-gradient(180deg,#1EB959 0%,#0E7A36 100%);border-color:#0B6330}
.opt.pick-no{background:linear-gradient(180deg,#D93A32 0%,#A81E15 100%);border-color:#8E1A12}
.opt.pick-no:hover{box-shadow:0 0 0 3px var(--yellow)}
.opt.reveal{background:linear-gradient(180deg,#1EB959 0%,#0E7A36 100%);border-color:#0B6330}
.opt.dim{opacity:.5}
.opt.dim:hover{filter:brightness(1);box-shadow:0 0 0 3px rgba(255,210,31,.5)}
.opt .tagx{
  flex:0 0 auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.2);
  border-radius:999px;padding:2px 8px;letter-spacing:.3px
}
.opt.pick-no .tagx{background:rgba(0,0,0,.25)}
.opt.pick-ok .tagx{background:rgba(0,0,0,.22)}

/* ======================== question footer ======================== */
.qfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{
  font-family:inherit;font-size:12.6px;font-weight:800;color:#fff;
  background:var(--choice-grad);border:1.5px solid rgba(255,255,255,.18);
  border-radius:999px;padding:7px 13px;cursor:pointer;
  transition:filter .13s ease,box-shadow .13s ease;filter:brightness(.96)
}
.btn:hover{filter:brightness(1.28);box-shadow:0 0 0 3px var(--yellow),0 0 0 7px rgba(255,210,31,.26)}
.btn.check{background:linear-gradient(180deg,#37536E 0%,#294056 100%)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.verdict{
  font-size:12.8px;font-weight:900;border-radius:999px;padding:5px 12px;display:none
}
.verdict.ok{display:inline-block;background:#E7F7ED;color:var(--green-dark);border:1.5px solid var(--green)}
.verdict.no{display:inline-block;background:#FDECEA;color:var(--red-dark);border:1.5px solid var(--red)}
.verdict.multi{display:inline-block;background:#EEF1F7;color:var(--blue-solid);border:1.5px solid var(--blue-solid)}
.note{
  margin-top:11px;border-left:7px solid var(--cl);background:#F8FAFD;border-radius:10px;
  padding:9px 12px;font-size:14.6px;color:#22272E
}
.note b{color:var(--cl)}
.lockedmsg{margin-top:10px;font-size:12.4px;font-weight:800;color:var(--grey-dark);display:none}
.lockedmsg.on{display:block}
.lockedmsg b{color:var(--blue-solid)}

/* ======================== LEFT rail : question task bar ======================== */
#rail{
  position:fixed;left:6px;top:50%;transform:translateY(-50%);z-index:900;
  display:flex;flex-direction:column;gap:4px;align-items:center;
  max-height:74vh;overflow-y:auto;overflow-x:hidden;
  background:rgba(255,255,255,.94);backdrop-filter:blur(4px);
  border:1.5px solid var(--line);border-radius:13px;padding:5px 5px;
  box-shadow:0 6px 18px rgba(15,25,50,.10);scrollbar-width:thin
}
#rail::-webkit-scrollbar{width:5px}
#rail::-webkit-scrollbar-thumb{background:#C6CDD8;border-radius:5px}
.nb{
  width:27px;height:27px;flex:0 0 auto;border:0;border-radius:8px;cursor:pointer;
  background:var(--grey);color:#fff;font-weight:800;font-size:12px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 1px 0 rgba(0,0,0,.12);transition:filter .12s ease,box-shadow .12s ease
}
.nb:hover{filter:brightness(1.15);box-shadow:0 0 0 3px var(--yellow)}
.nb.ok{background:var(--green)}
.nb.no{background:var(--red);box-shadow:0 0 0 2px #0A0B0D}   /* black rim = 'come back to this one' */
.nb.dot{border:2px solid var(--cl)}
.nb.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.railsep{width:22px;height:3px;border-radius:3px;margin:3px 0;background:var(--sc,#D6DCE5)}
#railtoggle{
  position:relative;width:22px;height:20px;border:0;border-radius:6px;background:#E9EDF3;color:#5B6472;
  font-size:10px;font-weight:900;cursor:pointer;padding:0;font-family:inherit;line-height:1
}
#railtoggle .rcount{
  position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;border-radius:999px;
  background:var(--red);color:#fff;font-size:9.5px;font-weight:900;display:flex;align-items:center;
  justify-content:center;padding:0 3px;border:1px solid #fff
}
.nb.hid{opacity:.28;outline:1.5px dashed #C6CDD8;outline-offset:1px}
#railtoggle:hover{box-shadow:0 0 0 3px var(--yellow)}
#rail.mini .nb,#rail.mini .railsep{display:none}

/* ======================== RIGHT side : index / search / reset / wrongs ======================== */
.rbtn{
  position:fixed;right:6px;z-index:930;width:30px;height:30px;border:0;border-radius:9px;cursor:pointer;
  color:#fff;font-size:14px;font-family:inherit;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 3px 10px rgba(15,25,50,.20);transition:filter .12s ease,box-shadow .12s ease
}
.rbtn:hover{filter:brightness(1.25);box-shadow:0 0 0 3px var(--yellow),0 0 0 7px rgba(255,210,31,.26)}
#idxbtn{top:8px;background:linear-gradient(135deg,#7C4DFF,#5230B8)}
#searchbtn{top:44px;background:linear-gradient(135deg,#00B4D8,#0B6E99)}
#resetbtn{top:44%;background:linear-gradient(135deg,#5C6B7F,#33404F);width:32px;height:32px;font-size:15px}
#wrongbtn{top:60%;background:#0A0B0D;width:32px;height:32px;position:fixed}
#wrongbtn .wcount{
  position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:999px;
  background:var(--yellow);color:#111;font-size:9.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 3px;border:1px solid #fff
}
.panel{
  position:fixed;z-index:940;right:44px;background:#fff;border:2px solid var(--line);
  border-radius:15px;box-shadow:0 14px 36px rgba(15,25,50,.20);padding:9px 10px;
  display:none;overflow-y:auto;scrollbar-width:thin
}
.panel.show{display:block}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#C6CDD8;border-radius:6px}
.panel h4{margin:2px 2px 7px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:#5B6472}
#idxpanel{top:8px;width:min(330px,90vw);max-height:76vh}
#idxpanel .grp{margin:8px 0 4px;font-size:12.5px;font-weight:900;color:var(--cl);
  border-left:5px solid var(--cl);padding-left:7px;border-radius:3px}
#idxpanel .qrow{
  display:flex;gap:7px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1.5px solid #EDF1F7;border-radius:9px;padding:5px 7px;margin:3px 0;
  font-family:inherit;font-size:13px;color:#20242B
}
#idxpanel .qrow:hover{box-shadow:0 0 0 3px var(--yellow);border-color:#DFE6F0}
#idxpanel .qrow .n{font-weight:900;color:var(--grey-dark);min-width:20px}
#idxpanel .qrow.st-ok .n{color:var(--green)}
#idxpanel .qrow.st-no .n{color:var(--red)}
#searchpanel{top:44px;width:min(360px,92vw);max-height:74vh}
#searchpanel input{
  width:100%;font-family:inherit;font-size:13.5px;padding:7px 9px;border-radius:10px;
  border:1.5px solid #DFE6F0;outline:0;margin-bottom:7px;font-weight:700;color:#15181C
}
#searchpanel input:focus{border-color:#00B4D8;box-shadow:0 0 0 3px rgba(0,180,216,.18)}
.kw{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;cursor:pointer;
  background:#F7F9FC;border:1.5px solid #E8EDF5;border-radius:10px;padding:6px 8px;margin:4px 0;
  font-family:inherit;font-size:12.9px;font-weight:700;color:#22262D
}
.kw:hover{box-shadow:0 0 0 3px var(--yellow)}
.kw .cnt{margin-left:auto;font-size:11px;font-weight:900;color:#0B6E99}
.kw.on{background:var(--choice-grad);color:#fff;border-color:var(--blue-solid)}
.kw.on .cnt{color:var(--yellow)}
.searchhint{font-size:11.4px;font-weight:700;color:#6E7887;line-height:1.45;margin:2px 2px 6px}

/* floating "wrong answers" tray (closed by default) */
#wrongpanel{top:auto;bottom:56px;width:min(304px,90vw);max-height:52vh}
#wrongpanel .wrow{
  display:flex;gap:8px;align-items:center;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:1.5px solid #EDF1F7;border-radius:10px;padding:5px 7px;margin:4px 0;
  font-family:inherit;font-size:12.6px;color:#20242B
}
#wrongpanel .wrow:hover{box-shadow:0 0 0 3px var(--yellow)}
#wrongpanel .wnum{
  flex:0 0 auto;width:25px;height:25px;border-radius:7px;background:#0A0B0D;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11.5px
}
#wrongpanel .wrow.ok2 .wnum{background:var(--green)}
#wrongpanel .empty{font-size:12.4px;color:#6E7887;font-weight:700;padding:2px}

/* filter bar + toast + tiny status */
#filterbar{
  position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:935;display:none;
  align-items:center;gap:8px;background:#fff;border:2px solid #00B4D8;border-radius:999px;
  padding:5px 11px;font-size:12.4px;font-weight:800;color:#0B6E99;
  box-shadow:0 6px 18px rgba(15,25,50,.14)
}
#filterbar.show{display:flex}
#filterbar button{border:0;background:#00B4D8;color:#fff;border-radius:999px;font-family:inherit;
  font-size:11.5px;font-weight:900;padding:3px 9px;cursor:pointer}
#toast{
  position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:9990;
  background:#15181D;color:#fff;border-radius:999px;padding:7px 14px;font-size:12.6px;font-weight:800;
  display:none;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:86vw;text-align:center
}
#toast.show{display:block}
#status{
  position:fixed;left:6px;bottom:6px;z-index:930;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.95);border:1.5px solid var(--line);border-radius:999px;
  padding:4px 9px;font-size:11.2px;font-weight:800;color:#5B6472;
  box-shadow:0 4px 14px rgba(15,25,50,.10);max-width:calc(100vw - 20px)
}
#status .num{color:var(--green)}
#status .den{color:var(--grey-dark)}
#sndbtn{
  border:0;background:#E9EDF3;border-radius:999px;font-size:12px;font-weight:900;color:#3A4250;
  cursor:pointer;font-family:inherit;padding:2px 8px
}
#sndbtn:hover{box-shadow:0 0 0 3px var(--yellow)}
#sndbtn.off{background:#FDECEA;color:var(--red-dark)}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:9980;pointer-events:none}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.opt.shake{animation:shake .34s ease 1}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.panel.show{animation:pop .16s ease-out 1}
.note.show{animation:pop .16s ease-out 1}

@media (max-width:1180px){ #page{padding-left:60px;padding-right:56px} }
@media (max-width:980px){
  #page{padding-left:14px;padding-right:14px;padding-bottom:150px}
  /* the number bar becomes a small strip of numbers along the bottom */
  #rail{
    top:auto;bottom:30px;left:6px;right:6px;transform:none;flex-direction:row;flex-wrap:nowrap;
    justify-content:flex-start;max-height:44px;max-width:none;overflow-x:auto;overflow-y:hidden;
    padding:4px 6px;gap:4px
  }
  .railsep{display:none}
  .nb{width:26px;height:26px}
  #railtoggle{flex:0 0 auto;order:-1}
  /* right icons stay on one row (tiny) */
  #idxbtn{top:6px}
  #searchbtn{top:6px;right:44px}
  #resetbtn{top:6px;right:82px;width:30px;height:30px}
  #wrongbtn{top:6px;right:120px;width:30px;height:30px}
  /* panels drop from under the icons, never off-screen */
  .panel{right:6px;left:6px;width:auto;max-height:60vh}
  #idxpanel{top:44px}#searchpanel{top:44px}
  #wrongpanel{top:44px;bottom:auto}
  #toast{bottom:84px;font-size:12px}
  #status{font-size:10.4px;padding:3px 7px;max-width:calc(100vw - 12px)}
  #statfile{max-width:26vw}
  .qtext{font-size:17px}
  .btn{font-size:12px;padding:6px 11px}

<script>
/* =============================================================================
   ILD Case Scenarios MCQs — interactive study engine
   Everything is event-driven: no idle animation, no moving page content.
   ========================================================================== */
(function () {
  'use strict';

  var DATA = window.__ILD_DATA__;
  var RAW = window.__ILD_SND__ || {};
  var FILE = DATA.file;

  /* ------------------------------ tiny helpers ------------------------------ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };
  var norm = function (s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  };
  var byN = {};
  DATA.questions.forEach(function (q) { byN[q.n] = q; });
  var TOPIC = {};
  DATA.topics.forEach(function (t) { TOPIC[t.id] = t; });

  /* =========================================================================
     SOUND ENGINE  — distinct sound for every single action (Web Audio API)
     Real recorded effects (applause, pop, boing) are embedded as data URIs and
     layered with synthesised tones so every action sounds different.
     ====================================================================== */
  var SND = (function () {
    var ctx = null, master = null, noiseBuf = null, buffers = {}, loading = {}, enabled = true, lastHover = 0, ok = true;

    function ac() {
      if (!ok) return null;
      try {
        if (!ctx) {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) { ok = false; return null; }
          ctx = new C();
          master = ctx.createGain();
          master.gain.value = 0.85;
          master.connect(ctx.destination);
          var n = ctx.createBuffer(1, ctx.sampleRate * 1.4, ctx.sampleRate), d = n.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          noiseBuf = n;
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      } catch (e) { ok = false; return null; }
    }
    function load(key, uri) {
      var c = ac(); if (!c || !uri || buffers[key] || loading[key]) return;
      loading[key] = true;
      var done = function (ab) {
        try { c.decodeAudioData(ab, function (b) { buffers[key] = b; }, function () {}); } catch (e) {}
      };
      try {
        /* fetch handles data: URIs reliably, even when the file is opened from disk */
        fetch(uri).then(function (r) { return r.arrayBuffer(); }).then(done).catch(function () {
          var x = new XMLHttpRequest();          /* very old browsers fallback */
          x.open('GET', uri, true); x.responseType = 'arraybuffer';
          x.onload = function () { done(x.response); }; x.send();
        });
      } catch (e) {
        try { var x2 = new XMLHttpRequest(); x2.open('GET', uri, true); x2.responseType = 'arraybuffer';
              x2.onload = function () { done(x2.response); }; x2.send(); } catch (e2) {}
      }
    }
    function unlock() {
      var c = ac(); if (!c) return;
      if (RAW.applause && !buffers.applause) load('applause', RAW.applause);
      if (RAW.pop && !buffers.pop) load('pop', RAW.pop);
      if (RAW.boing && !buffers.boing) load('boing', RAW.boing);
    }
    function sample(key, gain, rate) {
      var c = ac(); if (!c || !buffers[key]) return false;
      var s = c.createBufferSource(), g = c.createGain();

      s.playbackRate.value = rate || 1;
      g.gain.value = gain == null ? 0.7 : gain;
      s.connect(g); g.connect(master);
      s.start(0);
      return true;
    }
    /* one synthesised tone */
    function tone(o) {
      var c = ac(); if (!c || !enabled) return;
      var t = c.currentTime + (o.at || 0);
      var osc = c.createOscillator(), g = c.createGain(), dest = master, f = null;
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f0, t);
      if (o.f1 != null) {
        if (o.mode === 'lin') osc.frequency.linearRampToValueAtTime(o.f1, t + o.dur);
        else osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur);
      }
      if (o.q) {
        f = c.createBiquadFilter();
        f.type = o.q.type || 'bandpass';
        f.frequency.setValueAtTime(o.q.f0, t);
        if (o.q.f1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.q.f1), t + o.dur);
        f.Q.value = o.q.Q == null ? 1.2 : o.q.Q;
        osc.connect(f); f.connect(g);
      } else { osc.connect(g); }
      g.gain.setValueAtTime(0.00001, t);
      g.gain.linearRampToValueAtTime(o.g == null ? 0.12 : o.g, t + Math.min(0.02, o.dur * 0.25));
      g.gain.exponentialRampToValueAtTime(0.00001, t + o.dur);
      g.connect(dest);
      osc.start(t); osc.stop(t + o.dur + 0.02);
    }
    /* one filtered noise sweep */
    function whoosh(o) {
      var c = ac(); if (!c || !enabled) return;
      var t = c.currentTime + (o.at || 0);
      var s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
      s.buffer = noiseBuf; s.loop = true;
      f.type = o.type || 'bandpass';
      f.Q.value = o.Q == null ? 0.9 : o.Q;
      f.frequency.setValueAtTime(o.f0, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1), t + o.dur);
      g.gain.setValueAtTime(0.00001, t);
      g.gain.linearRampToValueAtTime(o.g == null ? 0.09 : o.g, t + o.dur * 0.35);
      g.gain.exponentialRampToValueAtTime(0.00001, t + o.dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + o.dur + 0.03);
    }
    function chord(notes, o) {                       /* little arpeggio */
      o = o || {};
      notes.forEach(function (f, i) {
        tone({ type: o.type || 'triangle', f0: f, f1: f, at: (o.at || 0) + i * (o.step || 0.085), dur: o.dur || 0.30, g: o.g || 0.11 });
      });
    }

    return {
      unlock: unlock,
      isOn: function () { return enabled; },
      set: function (v) { enabled = !!v; if (enabled) { unlock(); ac(); } },
      /* --- every distinct action --- */
      click: function () { if (!sample('pop', 0.45, 1)) { tone({ type: 'square', f0: 560, f1: 300, dur: 0.07, g: 0.10 }); whoosh({ f0: 2400, f1: 900, dur: 0.05, g: 0.05 }); } },
      hover: function () {

      nav: function () { tone({ type: 'triangle', f0: 420, f1: 1250, dur: 0.16, g: 0.09, q: { type: 'bandpass', f0: 900, f1: 2200, Q: 2 } }); whoosh({ f0: 500, f1: 2600, dur: 0.18, g: 0.05 }); },
      correct: function () {
        var real = sample('applause', 0.75, 1);
        if (!real) { whoosh({ f0: 700, f1: 2200, dur: 0.7, g: 0.07, Q: 0.5 }); }
        chord([523.25, 659.25, 783.99, 1046.5], { at: 0.02, step: 0.09, dur: 0.42, g: 0.12, type: 'triangle' });
        tone({ type: 'sine', f0: 1568, f1: 2093, at: 0.42, dur: 0.5, g: 0.06 });
        whoosh({ f0: 2600, f1: 5200, at: 0.36, dur: 0.45, g: 0.035, Q: 3 });
      },
      wrong: function () {
        tone({ type: 'sawtooth', f0: 320, f1: 96, dur: 0.42, g: 0.14, q: { type: 'lowpass', f0: 1600, f1: 320, Q: 0.8 } });
        tone({ type: 'square', f0: 150, f1: 70, dur: 0.30, g: 0.09, at: 0.04 });
        whoosh({ f0: 420, f1: 120, dur: 0.28, g: 0.10, type: 'lowpass', Q: 0.7 });
      },
      partial: function () {
        tone({ type: 'triangle', f0: 660, f1: 660, dur: 0.18, g: 0.09 });
        tone({ type: 'triangle', f0: 880, f1: 880, dur: 0.22, g: 0.08, at: 0.12 });

      exclude: function () {

      },
      open: function () { whoosh({ f0: 600, f1: 3200, dur: 0.20, g: 0.07, Q: 1.1 }); tone({ type: 'sine', f0: 880, f1: 1320, dur: 0.14, g: 0.05 }); },
      close: function () { whoosh({ f0: 3000, f1: 500, dur: 0.17, g: 0.06, Q: 1.1 }); tone({ type: 'sine', f0: 1200, f1: 760, dur: 0.12, g: 0.045 }); },
      reset: function () {

        [0.0, 0.18, 0.36].forEach(function (t) { tone({ type: 'triangle', f0: 320, f1: 130, at: t, dur: 0.20, g: 0.07 }); });
      },
      armed: function () { tone({ type: 'square', f0: 900, f1: 900, dur: 0.06, g: 0.07 }); tone({ type: 'square', f0: 1350, f1: 1350, dur: 0.07, g: 0.07, at: 0.08 }); },
      hl: function () { tone({ type: 'sine', f0: 1500, f1: 1900, dur: 0.035, g: 0.05 }); },
      unhl: function () { tone({ type: 'sine', f0: 1300, f1: 950, dur: 0.045, g: 0.045 }); },
      blocked: function () { tone({ type: 'square', f0: 118, f1: 100, dur: 0.16, g: 0.10, q: { type: 'lowpass', f0: 500, Q: 0.8 } }); },
      filter: function () { whoosh({ f0: 900, f1: 3600, dur: 0.22, g: 0.06 }); tone({ type: 'triangle', f0: 1320, f1: 1320, dur: 0.12, g: 0.05, at: 0.08 }); },
      clearf: function () { whoosh({ f0: 3200, f1: 700, dur: 0.20, g: 0.06 }); },
      copy: function () { tone({ type: 'triangle', f0: 1046, f1: 1568, dur: 0.13, g: 0.09 }); tone({ type: 'sine', f0: 1568, f1: 2093, dur: 0.14, g: 0.06, at: 0.10 }); },
      badge: function () { tone({ type: 'sine', f0: 1180, f1: 1760, dur: 0.09, g: 0.055 }); },
      jump: function () { tone({ type: 'triangle', f0: 700, f1: 1400, dur: 0.11, g: 0.07 }); whoosh({ f0: 1200, f1: 3000, dur: 0.12, g: 0.035 }); }
    };
  })();

  /* =========================================================================
     SPECIAL EFFECTS — confetti / fireworks / twinkling stars (canvas, finite)
     ====================================================================== */
  var FX = (function () {
    var cv = $('#fx'), cx = cv.getContext('2d'), ps = [], raf = 0, dpr = 1;
    var CONF = ['#FFD21F', '#7C4DFF', '#00B4D8', '#FF8A3D', '#4DA3FF', '#F45BBA', '#36D399'];
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    addEventListener('resize', size);
    var T0 = 0;
    function loop(ts) {
      if (!T0) T0 = ts;
      var dt = Math.min(34, ts - T0); T0 = ts;
      cx.clearRect(0, 0, innerWidth, innerHeight);
      for (var i = ps.length - 1; i >= 0; i--) {
        var p = ps[i];
        p.life -= dt;
        if (p.life <= 0) { ps.splice(i, 1); continue; }
        if (p.k === 'c') {                        /* confetti piece */
          p.vy += 0.0009 * dt; p.x += (p.vx + Math.sin((ts + p.ph) / 260) * 0.35) * dt * 0.06;
          p.y += p.vy * dt * 0.06; p.rot += p.vr * dt;
          cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
          cx.globalAlpha = Math.max(0, Math.min(1, p.life / 500));
          cx.fillStyle = p.col;
          cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cx.restore();
        } else if (p.k === 's') {                 /* firework spark */
          p.vy += 0.00035 * dt; p.vx *= 0.992; p.vy *= 0.992;
          p.x += p.vx * dt * 0.06; p.y += p.vy * dt * 0.06;
          cx.globalAlpha = Math.max(0, p.life / p.life0);
          cx.fillStyle = p.col;
          cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
        } else {                                  /* golden star */
          var a = Math.max(0, p.life / p.life0) * (0.55 + 0.45 * Math.abs(Math.sin((ts + p.ph) / 150)));
          cx.globalAlpha = a; cx.fillStyle = '#FFC61A';
          cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
          star(cx, p.r); cx.restore();
        }
      }
      cx.globalAlpha = 1;
      if (ps.length) raf = requestAnimationFrame(loop); else { raf = 0; T0 = 0; }
    }
    function star(g, r) {
      g.beginPath();
      for (var i = 0; i < 10; i++) {
        var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
        g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      g.closePath(); g.fill();
    }
    function run() { if (!raf) raf = requestAnimationFrame(loop); }
    function confetti(n) {
      for (var i = 0; i < n; i++) {
        ps.push({ k: 'c', x: Math.random() * innerWidth, y: -20 - Math.random() * 160,
          vx: (Math.random() - 0.5) * 3.2, vy: 1.1 + Math.random() * 1.5,
          w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
          col: CONF[(Math.random() * CONF.length) | 0], ph: Math.random() * 1000,
          life: 2600 + Math.random() * 1800 });
      }
      run();
    }
    function burst(x, y, n, cols) {
      cols = cols || CONF;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.283, sp = 1.4 + Math.random() * 5.2;
        ps.push({ k: 's', x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2, r: 1.5 + Math.random() * 2.6,
          col: cols[(Math.random() * cols.length) | 0], life: 520 + Math.random() * 720, life0: 1240 });
      }
      run();
    }
    function stars(x, y, n) {
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.283, d = 24 + Math.random() * 78;
        ps.push({ k: 't', x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * 0.7, r: 5 + Math.random() * 8,
          rot: Math.random() * 6.283, ph: Math.random() * 1000, life: 1100 + Math.random() * 900, life0: 2000 });
      }
      run();
    }
    function puff(x, y) {
      for (var i = 0; i < 22; i++) {
        var a = Math.random() * 6.283, sp = 0.7 + Math.random() * 2.2;
        ps.push({ k: 's', x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 1.4 + Math.random() * 2,
          col: '#5B6472', life: 360 + Math.random() * 380, life0: 740 });
      }
      run();
    }
    function centre(el) { var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    return { confetti: confetti, burst: burst, stars: stars, puff: puff, centre: centre };
  })();

  /* =========================================================================
     STATE
     ====================================================================== */
  var KEY = 'ild-case-mcq-v1';
  var BLANK = { ans: {}, ex: {}, marks: {}, sound: true, filter: null, text: '', mini: false };
  var S = (function () {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); return Object.assign({}, BLANK, o); }
    } catch (e) {}
    return Object.assign({}, BLANK);
  })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function ansOf(n) { return S.ans[n] || null; }
  function exSet(n) { return S.ex[n] || (S.ex[n] = []); }

  /* =========================================================================
     RENDER
     ====================================================================== */
  var page = $('#page');

  function tokId(n, i) { return n + ':' + i; }

  /* every word of the file becomes one clickable highlight unit */
  function wordSpans(key, text) {
    var ti = 0;
    return String(text).split(/(\s+)/).map(function (p) {
      if (!p || /^\s+$/.test(p)) return p;
      return '<span class="w1" data-q="' + key + '" data-t="' + (ti++) + '">' + esc(p) + '</span>';
    }).join('');
  }
  function buildQText(n, text) { return wordSpans(n, text); }

  function render() {
    var html = '';
    DATA.cases.forEach(function (c) {
      var ckey = 'c:' + c.id, ci = 0;
      html += '<section class="case" id="case-' + c.id + '" style="--cl:' + c.color + '">' +
              '<h2>' + esc(c.name) + '</h2><ul>' +
              c.bullets.map(function (b) {
                var inner = b.split(/(\s+)/).map(function (w) {
                  if (/^\s+$/.test(w)) return w;
                  var id = ci++; return '<span class="w1" data-q="' + ckey + '" data-t="' + id + '">' + esc(w) + '</span>';
                }).join('');
                return '<li>' + inner + '</li>';
              }).join('') +
              '</ul></section>';
      DATA.questions.filter(function (q) { return q.topic === c.id; }).forEach(function (q) { html += qHTML(q); });
    });
    page.innerHTML = html;
    applyMarks();
    applyExcludes();
    applyAnswers();
    buildRail(); buildIndex(); buildWrong(); buildSearch(); syncStatus();
  }

  function qHTML(q) {
    var t = TOPIC[q.topic];
    return '<section class="q" id="q' + q.n + '" data-n="' + q.n + '" data-topic="' + q.topic + '" style="--cl:' + t.color + '">' +
      '<div class="qhead"><span class="qnum">' + q.n + '</span>' +
      '<span class="qtag"><i style="--cl:' + t.color + '"></i>' + esc(DATA.cases.filter(function (c) { return c.id === q.topic; })[0].name) + '</span></div>' +
      '<p class="qtext">' + buildQText(q.n, q.q) + '</p>' +
      '<ul class="opts">' + q.opts.map(function (o) {
        return '<li class="opt" data-q="' + q.n + '" data-k="' + o.k + '">' +
          '<span class="ltr">' + o.k + '</span><span class="txt">' + wordSpans('o' + q.n + ':' + o.k, o.t) + '</span>' +
          '<button class="xbtn" data-q="' + q.n + '" data-k="' + o.k + '" title="Exclude this choice (click again to bring it back)">✕</button>' +
        '</li>';
      }).join('') + '</ul>' +
      '<div class="qfoot">' +
        '<button class="btn check" hidden>Check answer</button>' +
        '<button class="btn why" data-q="' + q.n + '">Why ? (Google)</button>' +
        '<button class="btn rep" data-q="' + q.n + '">Wrong answer? send the file name + no. + the correct answer</button>' +
        '<span class="verdict"></span>' +
      '</div>' +
      ansLead(q) +
      '<div class="note" hidden><b>Note (from the PDF):</b> <span class="ntxt">' + wordSpans('n' + q.n, q.expl.join(' ')) + '</span></div>' +
      aiBlock(q) +
      '<div class="lockedmsg">This answer is finished and locked. To change it, use the <b>↺</b> button on the right — “remove your answers and start again”.</div>' +
    '</section>';
  }

  /* the lead line of the example file : "the answer: B. Idiopathic Pulmonary Fibrosis" */
  function ansLead(q) {
    var txt = q.correct.map(function (k) {
      var o = q.opts.filter(function (x) { return x.k === k; })[0];
      return k + '. ' + (o ? o.t : '');
    }).join(' | ');
    return '<div class="anslead" hidden><b>the answer:</b> ' + wordSpans('a' + q.n, txt) +
           '<span class="alnote">(the letters are shuffled on screen \u2014 the file line below shows the original letters)</span></div>';
  }

  /* ---------- AI notes : appear only after the answer is locked ----------
     layout copied from your example file : AI note (points) -> usMLE / PLAB notes
     -> mnemonic -> from the file -> the verbatim lines of the file.
     every word of the notes is clickable to highlight, like the rest of the file */
  function rich(key, text) {
    var out = '', bold = false, ti = 0;
    String(text).split(/(<b>|<\/b>)/).forEach(function (part) {
      if (part === '<b>') { bold = true; return; }
      if (part === '</b>') { bold = false; return; }
      if (!part) return;
      part.split(/(\s+)/).forEach(function (w) {
        if (/^\s+$/.test(w)) { out += w; return; }
        out += '<span class="w1' + (bold ? ' kwb' : '') + '" data-q="' + key + '" data-t="' + (ti++) + '">' + esc(w) + '</span>';
      });
    });
    return out;
  }
  function pts(key, arr, cls) {
    return '<ul class="' + (cls || 'apts') + '">' + arr.map(function (t, i) {
      return '<li class="apt">' + rich(key + ':' + i, t) + '</li>';
    }).join('') + '</ul>';
  }
  function aiBlock(q) {
    var a = q.ai || {};
    if (!a.why || !a.why.length) return '';
    var h = '<div class="ainote" hidden><b>\uD83E\uDD16 AI note:</b>' + pts('w' + q.n, a.why);
    if (a.notes && a.notes.length) {
      h += '<div class="wnotes"><div class="wsub">usMLE \u00b7 PLAB \u00b7 important notes</div>' +
           pts('x' + q.n, a.notes, 'wul tips') + '</div>';
    }
    if (a.mnem) h += '<div class="wmnem"><b>\uD83D\uDCA1 mnemonic</b><span class="mntxt">' + rich('m' + q.n, a.mnem) + '</span></div>';
    var pdfNote = (q.expl || []).join(' ');
    if (a.fileNote && a.fileNote !== pdfNote) h += '<div class="wfile">from the file: ' + esc(a.fileNote) + '</div>';
    if (a.lines && a.lines.length) {
      h += '<div class="flblock"><b>\uD83D\uDCC4 the lines of the file (verbatim)</b>' +
           '<div class="flhint">as printed in the PDF \u2014 the choice letters there may differ from the shuffled letters on screen</div>' +
           '<div class="flist2">' +
           a.lines.map(function (l) {
             return '<div class="fli2"><span class="flp">' + esc(l.p) + '</span><span class="fltxt2">' + esc(l.t) + '</span></div>';
           }).join('') + '</div></div>';
    }
    return h + '</div>';
  }

  /* ---------- highlight marks ---------- */
  function applyMarks() {
    Object.keys(S.marks).forEach(function (n) {
      (S.marks[n] || []).forEach(function (i) {
        var sp = $('.w1[data-q="' + n + '"][data-t="' + i + '"]');
        if (sp) sp.classList.add('mk');
      });
    });
  }
  function toggleMark(sp) {
    var n = sp.getAttribute('data-q'), i = +sp.getAttribute('data-t');
    var arr = S.marks[n] || (S.marks[n] = []);
    var at = arr.indexOf(i);
    if (at < 0) { arr.push(i); sp.classList.add('mk'); SND.hl(); }
    else { arr.splice(at, 1); sp.classList.remove('mk'); SND.unhl(); }
    save();
  }

  /* ---------- excludes ---------- */
  function applyExcludes() {
    $$('.opt').forEach(function (el) {
      var n = +el.getAttribute('data-q'), k = el.getAttribute('data-k');
      var on = exSet(n).indexOf(k) >= 0;
      el.classList.toggle('ex', on);
      var b = $('.xbtn', el);
      if (b) { b.textContent = on ? '⤺' : '✕'; b.title = on ? 'Un-exclude this choice (bring it back)' : 'Exclude this choice (click again to bring it back)'; }
    });
  }
  function toggleEx(el) {
    var n = +el.getAttribute('data-q'), k = el.getAttribute('data-k');
    if (ansOf(n)) { SND.blocked(); toast('Answers are locked — reset the test to change your exclusions.'); return; }
    var arr = exSet(n), at = arr.indexOf(k);
    if (at < 0) { arr.push(k); SND.exclude(); } else { arr.splice(at, 1); SND.unex(); }
    save(); applyExcludes();
  }

  /* ---------- answering ---------- */
  function isMulti(q) { return q.correct.length > 1; }

  function pick(el) {
    var n = +el.getAttribute('data-q'), k = el.getAttribute('data-k'), q = byN[n];
    if (ansOf(n)) { SND.blocked(); toast('Locked ✔ — this answer is finished. Reset with the ↺ button if you want to start again.'); return; }
    if (exSet(n).indexOf(k) >= 0) { SND.blocked(); toast('You excluded this choice — click its ✕ again to bring it back first.'); return; }
    if (isMulti(q)) {
      var pend = pending[n] || (pending[n] = []);
      var at = pend.indexOf(k);
      if (at < 0) { pend.push(k); el.classList.add('choosing'); } else { pend.splice(at, 1); el.classList.remove('choosing'); }
      SND.click();
      var box = $('.q[data-n="' + n + '"] .check');
      if (box) { box.hidden = pend.length === 0; box.textContent = 'Check answer (' + pend.length + ' selected)'; }
      return;
    }
    commit(n, [k], el);
  }
  var pending = {};

  function commit(n, picked, el) {
    var q = byN[n];
    var ok = q.correct.length === picked.length && q.correct.every(function (c) { return picked.indexOf(c) >= 0; });
    $$('.opt[data-q="' + n + '"]').forEach(function (x) { x.classList.remove('choosing'); });
    S.ans[n] = { p: picked.slice(), ok: ok };
    save();
    applyAnswers();
    buildRail(); buildIndex(); buildWrong(); syncStatus();
    var box = $('#q' + n);
    var anchor = el || $('.opt[data-q="' + n + '"]', box) || box;
    var c = FX.centre(anchor);
    if (ok) {
      SND.correct();
      FX.confetti(100);
      FX.burst(c.x, c.y, 70);
      FX.stars(c.x, c.y, 9);
      toast('Correct ✔  Question ' + n + '  — ' + q.correct.join(', '));
    } else {
      SND.wrong();
      FX.puff(c.x, c.y);
      anchor.classList.add('shake');
      setTimeout(function () { anchor.classList.remove('shake'); }, 420);
      var right = q.correct.map(function (k) {
        var o = q.opts.filter(function (x) { return x.k === k; })[0]; return k + '. ' + o.t;
      }).join(' | ');
      toast('Not correct ✕  Question ' + n + ' — the right answer is ' + right);
    }
  }

  function applyAnswers() {
    Object.keys(S.ans).forEach(function (ns) {
      var n = +ns, a = S.ans[n], q = byN[n], sec = $('#q' + n);
      if (!sec || !q) return;
      $$('.opt', sec).forEach(function (el) {
        var k = el.getAttribute('data-k');
        var isCor = q.correct.indexOf(k) >= 0, isPick = a.p.indexOf(k) >= 0;
        el.classList.add('locked');
        var b = $('.xbtn', el); if (b) b.remove();
        if (isCor && isPick) { el.classList.add('pick-ok'); tag(el, 'your answer ✔ correct'); }
        else if (isCor && !isPick) { el.classList.add('reveal'); tag(el, 'the correct answer'); }
        else if (!isCor && isPick) { el.classList.add('pick-no'); tag(el, 'your answer ✕'); }
        else { el.classList.add('dim'); }
      });
      var v = $('.verdict', sec);
      if (v) {
        if (a.ok) { v.className = 'verdict ok'; v.textContent = 'Correct ✔'; }
        else if (a.p.length < q.correct.length && q.correct.some(function (c) { return a.p.indexOf(c) >= 0; })) {
          v.className = 'verdict multi'; v.textContent = 'Partially correct — you missed ' + q.correct.filter(function (c) { return a.p.indexOf(c) < 0; }).join(', ');
        } else { v.className = 'verdict no'; v.textContent = 'Wrong ✕ — the correct answer is ' + q.correct.join(', '); }
      }
      var note = $('.note', sec); if (note) { note.hidden = false; note.classList.add('show'); }
      var aib = $('.ainote', sec); if (aib) { aib.hidden = false; aib.classList.add('show'); }
      var al = $('.anslead', sec); if (al) { al.hidden = false; }
      var lm = $('.lockedmsg', sec); if (lm) lm.classList.add('on');
      var ck = $('.check', sec); if (ck) ck.hidden = true;
    });
  }
  function tag(el, text) {
    if ($('.tagx', el)) return;
    var s = document.createElement('span');
    s.className = 'tagx'; s.textContent = text;
    el.appendChild(s);
  }

  /* =========================================================================
     LEFT TASK BAR (question numbers)
     ====================================================================== */
  var rail = $('#rail');
  function buildRail() {
    var badCount = DATA.questions.filter(function (q) { var a = ansOf(q.n); return a && !a.ok; }).length;
    var h = '<button id="railtoggle" title="Collapse / show the number bar">' + (S.mini ? '»' : '«') +
      (badCount ? '<span class="rcount">' + badCount + '</span>' : '') + '</button>';
    var lastTopic = null;
    DATA.questions.forEach(function (q) {
      if (lastTopic && q.topic !== lastTopic) h += '<span class="railsep" style="--sc:' + TOPIC[q.topic].color + '"></span>';
      lastTopic = q.topic;
      var a = ansOf(q.n);
      var cls = 'nb' + (a ? (a.ok ? ' ok' : ' no') : '');
      var extra = ' style="border:2px solid ' + TOPIC[q.topic].color + '"';
      h += '<button class="' + cls + '" data-n="' + q.n + '"' + extra + ' title="Question ' + q.n + ' — ' +
        (a ? (a.ok ? 'answered correctly' : 'wrong: your answer ' + a.p.join(',') + ' · correct ' + q.correct.join(',')) : 'not answered yet') +
        '">' + q.n + '</button>';
    });
    rail.innerHTML = h;
    rail.classList.toggle('mini', !!S.mini);
    markCurrent();
  }
  function markCurrent() {
    var best = null, bestD = 1e9;
    $$('.q').forEach(function (sec) {
      var d = Math.abs(sec.getBoundingClientRect().top - 90);
      if (d < bestD) { bestD = d; best = sec; }
    });
    $$('.nb', rail).forEach(function (b) { b.classList.toggle('cur', best && +b.getAttribute('data-n') === +best.getAttribute('data-n')); });
  }
  function goTo(n, fromIdx) {
    var sec = $('#q' + n); if (!sec) return;
    SND.jump();
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    sec.classList.add('hit');
    setTimeout(function () { sec.classList.remove('hit'); }, 1100);
    markCurrent();
  }

  /* =========================================================================
     RIGHT SIDE : index · search · reset · mistakes tray
     ====================================================================== */
  var idxPanel = $('#idxpanel'), searchPanel = $('#searchpanel'), wrongPanel = $('#wrongpanel');
  var openPanel = null;
  function togglePanel(which, btn) {
    if (openPanel === which) { closePanels(true); return; }
    closePanels(false);
    var p = which === 'idx' ? idxPanel : which === 'search' ? searchPanel : wrongPanel;
    p.classList.add('show'); openPanel = which; SND.open();
  }
  function closePanels(sound) {
    if (!openPanel) return;
    idxPanel.classList.remove('show'); searchPanel.classList.remove('show'); wrongPanel.classList.remove('show');
    openPanel = null; if (sound) SND.close();
  }

  function buildIndex() {
    var h = '<h4>Index — click to jump</h4>';
    DATA.cases.forEach(function (c) {
      h += '<div class="grp" style="--cl:' + c.color + '">' + esc(c.name) + '</div>';
      DATA.questions.filter(function (q) { return q.topic === c.id; }).forEach(function (q) {
        var a = ansOf(q.n);
        h += '<button class="qrow' + (a ? (a.ok ? ' st-ok' : ' st-no') : '') + '" data-n="' + q.n + '">' +
          '<span class="n" style="color:' + (a ? (a.ok ? '#16A34A' : '#C2261F') : c.color) + '">' + q.n + '</span>' +
          '<span>' + esc(q.q) + '</span></button>';
      });
    });
    idxPanel.innerHTML = h;
  }

  function buildWrong() {
    var bad = DATA.questions.filter(function (q) { var a = ansOf(q.n); return a && !a.ok; });
    $('#wcount').textContent = bad.length;
    $('#wcount').style.display = bad.length ? 'flex' : 'none';
    var h = '<h4>Your mistakes (' + bad.length + ')</h4>';
    if (!bad.length) {
      h += '<div class="empty">Nothing here yet. Every question you get wrong is parked in this little tray (black numbers) so you can fly back to it anywhere in the page.</div>';
    } else {
      bad.forEach(function (q) {
        var a = ansOf(q.n);
        h += '<button class="wrow" data-n="' + q.n + '" title="' + esc(q.q) + '">' +
          '<span class="wnum">' + q.n + '</span>' +
          '<span><b>' + esc(q.q.length > 46 ? q.q.slice(0, 44) + '…' : q.q) + '</b><br>' +
          '<span style="font-size:11.4px;color:#6E7887">your answer: ' + a.p.join(', ') + ' — correct: ' + q.correct.join(', ') + '</span></span></button>';
      });
    }
    wrongPanel.innerHTML = h;
  }

  function buildSearch() {
    var h = '<h4>Search / keyword filter</h4>' +
      '<div class="searchhint">Pick a keyword group (or type your own word) — the file then shows <b>only</b> the questions whose <b>text, correct answer or note</b> contains it. Click the same chip again to bring everything back.</div>' +
      '<input id="sinput" placeholder="type any word, e.g. honeycomb" value="' + esc(S.text || '') + '">';
    DATA.keywords.forEach(function (k, i) {
      var c = countKw(k);
      h += '<button class="kw' + (S.filter === i ? ' on' : '') + '" data-k="' + i + '">' +
        '<span>' + esc(k.label) + '</span><span class="cnt">' + c + '</span></button>';
    });
    searchPanel.innerHTML = h;
  }
  /* what the keyword filter looks at : the question text, the CORRECT answer(s)
     and the note of the question  (never the wrong choices) */
  function qBlob(q) {
    var right = q.opts.filter(function (o) { return q.correct.indexOf(o.k) >= 0; })
                      .map(function (o) { return o.t; }).join(' ');
    return norm(q.q + ' ' + right + ' ' + (q.expl || []).join(' '));
  }
  function matchTerms(q, terms) {
    var b = qBlob(q);
    return terms.some(function (t) { return b.indexOf(norm(t)) >= 0; });
  }
  function matched(force) {
    var i = (force === undefined ? S.filter : force);
    if (i != null && DATA.keywords[i]) return DATA.questions.filter(function (q) { return matchTerms(q, DATA.keywords[i].terms); });
    if (S.text) {
      var t = norm(S.text).split(' ').filter(Boolean);
      return DATA.questions.filter(function (q) { var b = qBlob(q); return t.every(function (w) { return b.indexOf(w) >= 0; }); });
    }
    return null;                                   /* null = no filter */
  }
  function countKw(k) { return DATA.questions.filter(function (q) { return matchTerms(q, k.terms); }).length; }

  function applyFilter(silent) {
    var m = matched();
    var ids = m ? m.map(function (q) { return q.n; }) : null;
    $$('.q').forEach(function (sec) {
      var on = !ids || ids.indexOf(+sec.getAttribute('data-n')) >= 0;
      sec.style.display = on ? '' : 'none';
    });
    DATA.cases.forEach(function (c) {
      var any = !ids || DATA.questions.some(function (q) { return q.topic === c.id && ids.indexOf(q.n) >= 0; });
      var el = $('#case-' + c.id); if (el) el.style.display = any ? '' : 'none';
    });
    $$('.nb', rail).forEach(function (b) {
      var n = +b.getAttribute('data-n'), inFilter = !ids || ids.indexOf(n) >= 0;
      var a = ansOf(n);
      /* answered numbers stay visible (so nothing is "lost"), they just fade when out of the filter */
      b.classList.toggle('hid', !inFilter);
      b.style.display = (!inFilter && !a) ? 'none' : '';
    });
    var bar = $('#filterbar');
    if (ids) {
      var label = (S.filter != null && DATA.keywords[S.filter]) ? DATA.keywords[S.filter].label : ('“' + S.text + '”');
      bar.innerHTML = '<span>Filter: ' + esc(label) + ' → ' + ids.length + ' question' + (ids.length === 1 ? '' : 's') + '</span><button id="clrfilter">✕ show all</button>';
      bar.classList.add('show');
    } else { bar.classList.remove('show'); bar.innerHTML = ''; }
    if (!silent) markCurrent();
  }

  /* =========================================================================
     WHY / REPORT
     ====================================================================== */
  /* the case scenario card a question belongs to (name + its bullets), verbatim from the PDF */
  function caseBlock(q) {
    var c = DATA.cases.filter(function (x) { return x.id === q.topic; })[0];
    if (!c) return '';
    return c.name + '\n' + c.bullets.map(function (b) { return '\u2022 ' + b; }).join('\n');
  }
  /* Why -> the WHOLE case + the question + its choices go to Google and to the clipboard */
  function whyLink(q) {
    var txt = caseBlock(q) + '\n\nQ' + q.n + ': ' + q.q + '\n' +
              q.opts.map(function (o) { return o.k + '. ' + o.t; }).join('\n');
    return { txt: txt, url: 'https://www.google.com/search?q=' + encodeURIComponent(txt) };
  }
  function reportText(q) {
    var a = ansOf(q.n);
    return 'File name: ' + FILE +
      '\nQuestion number: ' + q.n +
      '\nCase: ' + caseBlock(q).split('\n').join(' / ') +
      '\nQuestion: ' + q.q +
      '\nChoices:\n' + q.opts.map(function (o) { return o.k + '. ' + o.t; }).join('\n') +
      '\nMy answer: ' + (a ? a.p.join(', ') : '(not answered)') +
      '\nWrong answer / correction: ' + q.correct.join(', ') + (a && a.ok ? ' (the file says mine was right — I still want to ask)' : '') +
      '\nWhy ?: ' + (q.expl.join(' ') || '—');
  }
  function openLink(url, what) {
    var w = null;
    try { w = window.open(url, '_blank', 'noopener'); } catch (e) { w = null; }
    if (!w) {
      copy(url);
      toast('Pop-up blocked here — ' + what + ' link copied to the clipboard: ' + url.slice(0, 74) + '…', 6000);
    }
    return !!w;
  }
  function copy(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return true; }
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      return true;
    } catch (e) { return false; }
  }

  /* =========================================================================
     TOAST + STATUS
     ====================================================================== */
  var toastEl = $('#toast'), toastT = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 3000);
  }
  function syncStatus() {
    var done = Object.keys(S.ans).length;
    var okc = DATA.questions.filter(function (q) { var a = ansOf(q.n); return a && a.ok; }).length;
    $('#statnum').innerHTML = 'Progress <b class="num">' + done + '</b><span class="den">/' + DATA.questions.length + '</span> answered · <b class="num">' + okc + '</b> correct';
    $('#statfile').textContent = '· ' + FILE;
  }

  /* =========================================================================
     EVENTS
     ====================================================================== */
  var lastHoverEl = null;
  document.addEventListener('mouseover', function (e) {
    var t = e.target;
    var hit = t.closest ? t.closest('.opt,.nb,.btn,.rbtn,.kw,.wrow,.qrow,#sndbtn,.xbtn,.w1,.panel') : null;
    var key = hit && hit.classList.contains('opt') && t.closest('.xbtn') ? t.closest('.xbtn') : hit;
    if (key && key !== lastHoverEl) { lastHoverEl = key; SND.hover(); }
    if (!hit) lastHoverEl = null;
  }, true);

  ['pointerdown', 'mousemove', 'keydown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { SND.unlock(); }, { once: true, passive: true });
  });

  document.addEventListener('click', function (e) {
    var t = e.target;
    /* exclude button */
    var x = t.closest('.xbtn');
    if (x) { e.stopPropagation(); toggleEx(x.closest('.opt')); return; }
    /* a word inside a choice : highlight it once the question is finished, or with Shift / Alt held;
       a plain click before answering still means "this is my answer" */
    var w = t.closest('.w1');
    var o = t.closest('.opt');
    if (w && o) {
      var qn = +o.getAttribute('data-q');
      if (ansOf(qn) || e.shiftKey || e.altKey) { toggleMark(w); return; }
    } else if (w) { toggleMark(w); return; }
    /* choice */
    if (o) { pick(o); return; }
    /* check (multi-answer questions) */
    var ck = t.closest('.check');
    if (ck) {
      var n = +ck.closest('.q').getAttribute('data-n');
      var sel = (pending[n] || []).slice();
      if (sel.length) { commit(n, sel, $('.opt[data-q="' + n + '"][data-k="' + sel[0] + '"]')); }
      return;
    }
    /* why */
    var wh = t.closest('.why');
    if (wh) {
      var q = byN[+wh.getAttribute('data-q')], L = whyLink(q);
      copy(L.txt); SND.why();
      if (openLink(L.url, 'Google')) toast('The whole case + the question + its choices were copied — opening Google with the same text…', 4200);
      return;
    }
    /* report */
    var rp = t.closest('.rep');
    if (rp) {
      var qr = byN[+rp.getAttribute('data-q')];
      var okc = copy(reportText(qr)); SND.copy();
      if (openLink(DATA.report, 'the anonymous message')) {
        toast(okc ? 'The file name, question number and the correction are copied — paste them in the anonymous box.' : 'Opening the anonymous message box…', 4200);
      }
      return;
    }
    /* number boxes */
    var nb = t.closest('.nb');
    if (nb) { goTo(+nb.getAttribute('data-n')); return; }
    if (t.closest('#railtoggle')) { S.mini = !S.mini; save(); rail.classList.toggle('mini', S.mini); $('#railtoggle').textContent = S.mini ? '»' : '«'; SND.click(); return; }
    /* right side icons */
    if (t.closest('#idxbtn')) { SND.click(); togglePanel('idx'); return; }
    if (t.closest('#searchbtn')) { SND.click(); togglePanel('search'); return; }
    if (t.closest('#wrongbtn')) { SND.click(); togglePanel('wrong'); return; }
    if (t.closest('#clrfilter')) {
      S.filter = null; S.text = ''; save(); SND.clearf();
      var inp = $('#sinput'); if (inp) inp.value = '';
      buildSearch(); applyFilter(); return;
    }
    /* reset */
    var rb = t.closest('#resetbtn');
    if (rb) {
      if (!rb.classList.contains('armed')) {
        rb.classList.add('armed'); rb.textContent = '✓';
        rb.style.boxShadow = '0 0 0 3px #FFD21F, 0 0 0 7px rgba(255,210,31,.3)';
        SND.armed();
        toast('Click the ✓ once more to erase every answer, highlight and exclusion.', 3600);
        setTimeout(function () {
          if (rb.classList.contains('armed')) { rb.classList.remove('armed'); rb.textContent = '↺'; rb.style.boxShadow = ''; }
        }, 4200);
        return;
      }
      rb.classList.remove('armed'); rb.textContent = '↺'; rb.style.boxShadow = '';
      S.filter = null; S.text = ''; S.ans = {}; S.ex = {}; S.marks = {}; pending = {};
      save(); SND.reset(); render(); applyFilter(true);
      toast('Fresh start ✔  All answers, highlights and exclusions were removed.', 3200);
      FX.burst(innerWidth / 2, 120, 40, ['#FFD21F', '#00B4D8', '#7C4DFF']);
      return;
    }
    /* index / mistakes rows */
    var row = t.closest('#idxpanel .qrow, #wrongpanel .wrow');
    if (row) { goTo(+row.getAttribute('data-n')); if (openPanel === 'wrong') closePanels(false); return; }
    /* keyword chip */
    var kw = t.closest('.kw');
    if (kw) {
      var i = +kw.getAttribute('data-k');
      S.filter = (S.filter === i) ? null : i; S.text = '';
      var inp2 = $('#sinput'); if (inp2) inp2.value = '';
      save(); SND.filter(); buildSearch(); applyFilter();
      if (S.filter != null) {
        var m = matched();
        toast('Showing ' + m.length + ' question' + (m.length === 1 ? '' : 's') + ' for “' + DATA.keywords[i].label + '”. Click the chip again to show everything.', 4200);
      } else { toast('Filter removed — all questions are back.', 2600); }
      return;
    }
    /* sound toggle */
    if (t.closest('#sndbtn')) {
      S.sound = !S.sound; SND.set(S.sound); save();
      var b = $('#sndbtn'); b.classList.toggle('off', !S.sound); b.textContent = S.sound ? 'sounds: on' : 'sounds: off';
      if (S.sound) SND.click();
      return;
    }
    /* click anywhere else = soft click */
    if (t.closest('#page')) SND.click();
  });

  /* live typing in the search box */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'sinput') {
      S.text = e.target.value; S.filter = null; save();
      buildSearch();
      var inp = $('#sinput'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      applyFilter(true);
    }
  });

  /* scroll spy for the number bar (no animation, only highlight) */
  var st = 0;
  addEventListener('scroll', function () {
    var t = Date.now(); if (t - st < 110) return; st = t; markCurrent();
  }, { passive: true });

  /* keyboard: 1-9 / a-d answer the question under the cursor, esc closes panels */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePanels(true); return; }
    var sec = $('.q.cur') || null;
    if (!sec) {
      var best = null, bd = 1e9;
      $$('.q').forEach(function (s2) { var d = Math.abs(s2.getBoundingClientRect().top - 120); if (d < bd) { bd = d; best = s2; } });
      sec = best;
    }
    if (!sec || $('#sinput') === document.activeElement) return;
    var k = e.key.toUpperCase();
    if ('ABCD'.indexOf(k) >= 0) { var el = $('.opt[data-q="' + sec.getAttribute('data-n') + '"][data-k="' + k + '"]'); if (el) pick(el); }
  });

  /* =========================================================================
     GO
     ====================================================================== */
  function boot() {
    render();
    applyFilter(true);
    var b = $('#sndbtn');
    b.classList.toggle('off', !S.sound); b.textContent = S.sound ? 'sounds: on' : 'sounds: off';
    SND.set(S.sound);
    if (Object.keys(S.ans).length) toast('Welcome back — your answers were restored.', 2600);
    else toast('Tap any choice to answer · click any word (question, answers, notes) to highlight it · Shift+click highlights inside a choice before answering · ↺ restarts the test.', 6400);
  }
  boot();
})();

</script>
